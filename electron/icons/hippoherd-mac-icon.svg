<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Hippo Herd macOS app icon">
  <title>Hippo Herd macOS icon</title>
  <!--
    The mark from website/favicon.svg, placed on the macOS app-icon grid the
    same way JsonHippo's and Chip Hippo's are: the 512-unit artwork scaled by
    826/512 (= 1.61328125) and offset 99px, so the rounded square fills a
    centred 826×826 region of the 1024 canvas with a TRANSPARENT margin on
    every side (Big Sur's 824/100 safe area, one pixel larger each way).
    Keep the art in step with website/favicon.svg; `make icons` rasterises both.
  -->
  <g transform="translate(99,99) scale(1.61328125)">
    <rect width="512" height="512" rx="114" fill="#2BC4B0"/><g fill="#FFFFFF" opacity="0.5"><g transform="translate(-23.4 56) scale(0.52)"><circle cx="170" cy="146" r="40"/><circle cx="342" cy="146" r="40"/><rect x="144" y="140" width="224" height="190" rx="74"/><rect x="118" y="260" width="276" height="150" rx="74"/></g><g transform="translate(269.1 56) scale(0.52)"><circle cx="170" cy="146" r="40"/><circle cx="342" cy="146" r="40"/><rect x="144" y="140" width="224" height="190" rx="74"/><rect x="118" y="260" width="276" height="150" rx="74"/></g></g><g transform="translate(56.3 82) scale(0.78)"><g fill="#2BC4B0" stroke="#2BC4B0" stroke-width="30" stroke-linejoin="round"><circle cx="170" cy="146" r="40"/><circle cx="342" cy="146" r="40"/><rect x="144" y="140" width="224" height="190" rx="74"/><rect x="118" y="260" width="276" height="150" rx="74"/></g><g fill="#FFFFFF"><circle cx="170" cy="146" r="40"/><circle cx="342" cy="146" r="40"/><rect x="144" y="140" width="224" height="190" rx="74"/><rect x="118" y="260" width="276" height="150" rx="74"/></g><circle cx="201" cy="198" r="17" fill="#2BC4B0"/><circle cx="311" cy="198" r="17" fill="#2BC4B0"/><ellipse cx="210" cy="330" rx="14" ry="20" fill="#2BC4B0"/><ellipse cx="302" cy="330" rx="14" ry="20" fill="#2BC4B0"/></g>
  </g>
</svg>
