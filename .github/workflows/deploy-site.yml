name: Deploy Website

# Builds hippoherd.com and publishes it to GitHub Pages.
#
# Two generators run here, in this order, and both matter:
#
#   scripts/build-versions.mjs  reads the GitHub Releases API for all seven hippo
#                               repositories and writes website/versions.json,
#                               which is what puts a real installer behind the
#                               "Download for your machine" button.
#   scripts/build-site.mjs      turns content/hippos.mjs into the eight pages.
#
# Both outputs are also committed, so a checkout serves without a build step —
# but they are regenerated here regardless, because a herd page whose version
# numbers are whatever they were at the last hand-run is exactly the kind of
# quiet staleness this repository exists to avoid. Rest Hippo ships often; the
# site should not need a commit here to notice.
#
# NOTE: there is deliberately NO `paths:` filter. A path-filtered push trigger
# does not reliably fire on a squash-merge commit, and the build takes seconds.
#
# NOTE: the sibling projects' release workflows do not (and should not) know
# this repository exists, so a new Rest Hippo release will not deploy this site
# by itself. The scheduled run below is what closes that gap: once a day, the
# herd re-reads every repo's releases and redeploys if anything moved.
on:
  push:
    branches: [main]
  schedule:
    # 07:15 UTC daily — after a release published overnight, before most of the
    # day's visitors. Cron on a fork or a quiet repo gets disabled by GitHub
    # after 60 days of inactivity; a push re-enables it.
    - cron: "15 7 * * *"
  workflow_dispatch: {}

# GITHUB_TOKEN scopes Pages needs; id-token lets deploy-pages attest the artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; let queued runs wait their turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      # The default GITHUB_TOKEN is scoped to THIS repository, which is enough:
      # reading a public repo's releases needs only a valid token, not access to
      # that repo. All seven hippos are public as of 15 August 2026, but a repo
      # that is private (or does not exist yet) answers 404 here, and
      # build-versions.mjs treats that as "no releases yet" rather than as an
      # error — which is also the right answer for a repo that has none. A
      # hippo added to the herd before its repo opens will not fail this build.
      - name: Generate versions.json from every hippo's releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-versions.mjs --out website/versions.json

      - name: Generate the pages
        run: node scripts/build-site.mjs

      # The marks are pure functions of scripts/make-marks.mjs, so regenerating
      # them costs nothing and removes the one way they could be stale: an edit
      # to the generator that was never re-run before committing.
      - name: Generate the hippo marks
        run: node scripts/make-marks.mjs

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
